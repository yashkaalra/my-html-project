<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Exam Math Challenge</title>

<style>
body{
font-family:Arial;
background:#0a0a0a;
color:#00ffcc;
text-align:center;
margin-top:40px;
}

h1{text-shadow:0 0 10px #00ffcc;}

.container{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

.problem{
font-size:2em;
font-weight:bold;
}

.option{
font-size:1.3em;
padding:10px 20px;
background:#00ffcc;
color:black;
border:none;
cursor:pointer;
border-radius:6px;
width:220px;
font-weight:bold;
}

.option:hover{background:#009988;}

.correct{background:#4CAF50 !important;}
.incorrect{background:#ff4444 !important;}

.options{
display:flex;
flex-direction:column;
gap:10px;
}

.timer-circle{
width:100px;
height:100px;
border-radius:50%;
border:10px solid #ff4444;
display:flex;
align-items:center;
justify-content:center;
font-size:1.6em;
font-weight:bold;
color:#ff4444;
box-shadow:0 0 10px #ff4444;
}

input{
font-size:1.4em;
padding:10px;
border-radius:5px;
width:160px;
text-align:center;
}

footer{margin-top:40px;}
</style>
</head>

<body>

<h1>Math Challenge</h1>

<div class="container" id="mode-screen">
<h2>Select Answer Mode</h2>
<button class="option" onclick="setAnswerMode('mcq')">MCQ Mode</button>
<button class="option" onclick="setAnswerMode('typing')">Typing Mode</button>
</div>


<div class="container" id="type-selection-screen" style="display:none">
<h2>Select Question Type</h2>

<button class="option" onclick="startGame(['+'])">Addition</button>
<button class="option" onclick="startGame(['-'])">Subtraction</button>
<button class="option" onclick="startGame(['*'])">Multiplication 2×2</button>
<button class="option" onclick="startGame(['*3x2'])">Multiplication 3×2</button>
<button class="option" onclick="startGame(['square'])">Squares</button>
<button class="option" onclick="startGame(['percent'])">Percentage</button>
<button class="option" onclick="startGame(['division'])">Division</button>

<button class="option" onclick="startGame(['+','-','*','*3x2','square','percent','division'])">
All Mixed
</button>

</div>


<div class="container" id="game-screen" style="display:none">

<div class="problem" id="problem"></div>

<div class="options" id="options"></div>

<div class="timer-circle" id="timer-circle">30</div>

<div id="score">Score: 0</div>
<div id="streak">Streak: 0</div>

</div>

<footer>Prepared by Yash Kalra</footer>

<script>

let timer
let timeLeft = 30

let score = 0
let streak = 0
let questionCount = 0
let totalQuestions = 25

let currentAnswer
let selectedTypes
let answerMode = "mcq"

let totalTime = 0


function setAnswerMode(mode){

answerMode = mode

document.getElementById("mode-screen").style.display="none"
document.getElementById("type-selection-screen").style.display="flex"

}


function startGame(types){

selectedTypes = types

document.getElementById("type-selection-screen").style.display="none"
document.getElementById("game-screen").style.display="flex"

score = 0
streak = 0
questionCount = 0
totalTime = 0

generateProblem()

}



function generateProblem(){

if(questionCount >= totalQuestions){
showResult()
return
}

questionCount++

let type = selectedTypes[Math.floor(Math.random()*selectedTypes.length)]

let a,b


if(type==="+"){
a = rand(10,99)
b = rand(10,99)
currentAnswer = a+b
document.getElementById("problem").textContent = a+" + "+b
}

else if(type==="-" ){
a = rand(10,99)
b = rand(10,a)
currentAnswer = a-b
document.getElementById("problem").textContent = a+" - "+b
}

else if(type==="*"){
a = rand(11,30)
b = rand(11,30)
currentAnswer = a*b
document.getElementById("problem").textContent = a+" × "+b
}

else if(type==="*3x2"){
a = rand(101,299)
b = rand(11,29)
currentAnswer = a*b
document.getElementById("problem").textContent = a+" × "+b
}

else if(type==="square"){
a = rand(1,200)
currentAnswer = a*a
document.getElementById("problem").textContent = a+"²"
}

else if(type==="percent"){
a = rand(10,80)
b = rand(50,500)
currentAnswer = Math.round((a/100)*b)
document.getElementById("problem").textContent = a+"% of "+b
}

else if(type==="division"){
b = rand(2,20)
currentAnswer = rand(5,40)
a = currentAnswer*b
document.getElementById("problem").textContent = a+" ÷ "+b
}

generateOptions()
startTimer()

}



function generateOptions(){

let container = document.getElementById("options")
container.innerHTML=""

if(answerMode==="mcq"){

let correctIndex = rand(0,3)
let used = new Set()

for(let i=0;i<4;i++){

let val

if(i===correctIndex){
val = currentAnswer
}else{
do{
val = currentAnswer + rand(-50,50)
}while(used.has(val) || val===currentAnswer)
}

used.add(val)

let btn = document.createElement("button")
btn.className="option"
btn.textContent = val
btn.onclick = ()=>checkAnswer(btn,val)

container.appendChild(btn)

}

}

else{

let input = document.createElement("input")
input.type="number"
input.placeholder="Type answer"

let submit = document.createElement("button")
submit.className="option"
submit.textContent="Submit"

submit.onclick = ()=>checkAnswer(input,parseInt(input.value))

input.addEventListener("keypress",function(e){
if(e.key==="Enter"){
checkAnswer(input,parseInt(input.value))
}
})

container.appendChild(input)
container.appendChild(submit)

setTimeout(()=>input.focus(),50)

}

}



function checkAnswer(source,val){

clearInterval(timer)

let timeTaken = 30 - timeLeft
totalTime += timeTaken

if(val === currentAnswer){

score++
streak++

if(source.tagName==="BUTTON") source.classList.add("correct")

}else{

streak = 0

if(source.tagName==="BUTTON") source.classList.add("incorrect")

highlightCorrect()

}

document.getElementById("score").textContent="Score: "+score
document.getElementById("streak").textContent="Streak: "+streak

setTimeout(generateProblem,1000)

}



function highlightCorrect(){

document.querySelectorAll(".option").forEach(btn=>{
if(parseInt(btn.textContent)===currentAnswer){
btn.classList.add("correct")
}
})

}



function startTimer(){

timeLeft = 30

let timerCircle = document.getElementById("timer-circle")

timerCircle.textContent = timeLeft

timerCircle.style.borderColor="#ff4444"
timerCircle.style.color="#ff4444"

timer = setInterval(()=>{

timeLeft--

timerCircle.textContent = timeLeft

timerCircle.style.transform=`scale(${timeLeft/30})`

if(timeLeft<=5){
timerCircle.style.borderColor="#ff0000"
timerCircle.style.color="#ff0000"
}

if(timeLeft<=0){
clearInterval(timer)
checkAnswer(document.createElement("div"),NaN)
}

},1000)

}



function showResult(){

document.getElementById("game-screen").style.display="none"

let accuracy=((score/totalQuestions)*100).toFixed(2)
let avgTime=(totalTime/totalQuestions).toFixed(2)

document.body.innerHTML=`

<div class="container">

<h2>Test Complete</h2>

<p><strong>Score:</strong> ${score}/${totalQuestions}</p>

<p><strong>Accuracy:</strong> ${accuracy}%</p>

<p><strong>Average Time:</strong> ${avgTime} sec</p>

<button class="option" onclick="location.reload()">Play Again</button>

</div>

<footer>Prepared by Yash Kalra</footer>

`

}



function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min
}

</script>

</body>
</html>
